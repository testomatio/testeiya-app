name: CLI Tests

on:
  push:
    paths:
      - "cli/**"
      - ".github/workflows/cli-test.yml"
  pull_request:
    paths:
      - "cli/**"
      - ".github/workflows/cli-test.yml"

jobs:
  test:
    name: bun test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun test
