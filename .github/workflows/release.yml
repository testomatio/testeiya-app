name: Release

# Publishes the `testeiya` CLI to npm. The skills the agent reads are not kept
# in git — they belong to the repositories that wrote them — so every publish
# fetches them fresh from the sources in skills/skills.yaml. Skip that step and
# the package ships an empty skills tree.
#
# Only `cli-v*` releases publish. Create them with `--latest=false`: the desktop
# app's `v*` releases carry the installers and the updater manifest, and the app
# and README read them through `releases/latest`.
# `workflow_dispatch` re-publishes a tag by hand, which is the recovery path
# when a release is edited rather than published (an edit fires no `published`).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. cli-v0.4.0"
        required: true

permissions:
  contents: read
  # OIDC token for npm Trusted Publishing + provenance (no NPM_TOKEN needed).
  id-token: write

jobs:
  publish:
    name: Publish to npm
    if: startsWith(github.event.release.tag_name || inputs.tag, 'cli-v')
    runs-on: ubuntu-latest
    # Write, to hand latest back to the desktop release below.
    permissions:
      contents: write
      id-token: write
    steps:
      # An empty ref keeps checkout's default, which on a release event is the
      # tag itself; a manual run names the tag it wants to republish.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Update npm (Trusted Publishing support)
        run: npm install -g npm@latest

      # The release event carries its own tag; a manual run passes it as an input.
      - name: Resolve the tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${RELEASE_TAG:-$INPUT_TAG}"
          test -n "$tag" || { echo "no release tag to publish"; exit 1; }
          echo "name=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag"

      - run: npm ci

      - name: Build
        run: npm run build

      # The vendored skill folders are gitignored, so they are absent from a
      # fresh checkout. This fetches the current version of every source in
      # skills/skills.yaml, which `files: ["skills"]` then packs.
      - name: Vendor the external skills
        run: node scripts/vendor-skills.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync version from the release tag
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: npm version "${TAG#cli-v}" --no-git-tag-version --allow-same-version

      - name: Determine npm dist-tag
        id: npm_tag
        env:
          TAG: ${{ steps.tag.outputs.name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if echo "$TAG" | grep -qE "alpha|-alpha|\.a\."; then
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
          elif echo "$TAG" | grep -qE "beta|-beta|\.b\."; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          elif echo "$TAG" | grep -qE "rc|-rc|\.rc\."; then
            echo "tag=rc" >> "$GITHUB_OUTPUT"
          elif [ "$PRERELEASE" = "true" ]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # Skip when the version is already on the registry (a re-run, or a first
      # version published by hand to bootstrap Trusted Publishing).
      - name: Publish
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "testeiya@$version" version >/dev/null 2>&1; then
            echo "testeiya@$version already published — skipping."
            exit 0
          fi
          npm publish --provenance --tag ${{ steps.npm_tag.outputs.tag }}

      # The GitHub UI ticks "latest" by default. A cli-v release left as latest
      # breaks the desktop updater, which reads releases/latest/download/runtime.json.
      - name: Keep the newest desktop release latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list -R "$GITHUB_REPOSITORY" --exclude-pre-releases --json tagName -q '[.[] | select(.tagName | startswith("cli-v") | not)][0].tagName')
          test -n "$tag" || { echo "no desktop release to mark latest"; exit 0; }
          gh release edit "$tag" -R "$GITHUB_REPOSITORY" --latest
