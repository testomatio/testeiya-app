name: Release

# One GitHub Release drives two independent pipelines in parallel:
#   • desktop     — builds the Electrobun installers (web/desktop app, root package.json)
#   • publish-cli — publishes the `testeiya` CLI to npm (cli/package.json)
# Both take their version from the release tag, so the two packages ship in lockstep
# while remaining separately versioned artifacts.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # ---- Desktop app → installers attached to the release --------------------
  desktop:
    name: Desktop (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: windows-latest
            label: win-x64
          - os: macos-14
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # This repo is maintained with bun (bun.lock is the source of truth;
      # package-lock.json is stale), so install with bun, not `npm ci`. The root
      # postinstall installs the cli/ package deps that the app-server needs.
      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Sync version from release tag
        if: github.event_name == 'release'
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build desktop installer
        run: bun run desktop:release
        env:
          CI: true

      # electrobun's self-extracting installers can't unpack this app's deep
      # node_modules (paths > 100 chars -> TarUnsupportedFileType). Repackage
      # into formats that can: AppImage (squashfs) on Linux, a plain zip on
      # Windows. macOS keeps the .dmg (no tar, unaffected).
      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: bash .github/packaging/build-linux-appimage.sh

      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path winstage | Out-Null
          tar.exe -xf artifacts/stable-win-x64-Testeiya.tar.zst -C winstage
          tar.exe -a -cf artifacts/stable-win-x64-Testeiya.zip -C winstage Testeiya
          Remove-Item artifacts/stable-win-x64-Testeiya-Setup.zip -Force -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force winstage
          Get-Item artifacts/stable-win-x64-Testeiya.zip | Format-List Name,Length

      - name: Attach installer to the Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.AppImage
            artifacts/*.dmg
            artifacts/stable-win-x64-Testeiya.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts (manual runs)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: testeiya-${{ matrix.label }}
          path: artifacts/*

  # ---- CLI → published to the npm registry ---------------------------------
  publish-cli:
    name: Publish CLI to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # registry-url wires NODE_AUTH_TOKEN into ~/.npmrc for `npm publish`.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install CLI dependencies
        run: bun install --frozen-lockfile

      - name: Sync version from release tag
        if: github.event_name == 'release'
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        if: github.event_name == 'release'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Manual runs never publish — just validate what the tarball would contain.
      - name: Dry-run pack (manual runs)
        if: github.event_name != 'release'
        run: npm pack --dry-run

  # After the desktop installers are attached, append per-OS install
  # instructions to the Release body (once). Idempotent: skips if already present.
  release-notes:
    name: Add install instructions
    needs: desktop
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Append install instructions to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          body=$(gh release view "$TAG" --json body -q .body)
          if printf '%s' "$body" | grep -qF '<!-- install-instructions -->'; then
            echo "Install instructions already present — skipping."
            exit 0
          fi
          { printf '%s\n\n' "$body"; cat .github/release-install-notes.md; } \
            | gh release edit "$TAG" --notes-file -
