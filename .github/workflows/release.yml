name: Release Desktop Apps

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: windows-latest
            label: win-x64
          - os: macos-14
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      # Main repo uses the built-in GITHUB_TOKEN (which always has access to its
      # own repo). persist-credentials:false stops checkout from leaving that
      # token's auth header in .git/config, where it would otherwise shadow the
      # PAT when fetching the private submodule below.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Rewrite SSH->HTTPS+PAT so the private submodule (testclaw) and the
      # @testomatio/skills npm dep (git+ssh) authenticate with PRIVATE_REPOS_TOKEN.
      # insteadOf is multi-valued: --add so BOTH the scp-style (git@github.com:,
      # used by the submodule) and the ssh:// form (used by the @testomatio/skills
      # git+ssh dep) are rewritten. Without --add the second line overwrites the
      # first, leaving the submodule URL un-rewritten -> SSH publickey failure.
      - name: Configure git auth for private deps
        shell: bash
        run: |
          git config --global --add url."https://x-access-token:${{ secrets.PRIVATE_REPOS_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${{ secrets.PRIVATE_REPOS_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"

      - name: Initialize agent submodule
        run: git submodule update --init --recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # This repo is maintained with bun (bun.lock is the source of truth;
      # package-lock.json is stale), so install with bun, not `npm ci`.
      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install agent (testeiya) dependencies
        run: bun install --frozen-lockfile
        working-directory: testeiya

      # @testomatio/skills ships a stray dangling symlink
      # (plugins/test-management/skills/hello -> ../../../skills/hello, which
      # doesn't exist upstream). electrobun copies node_modules with
      # dereference:true and aborts when it can't stat a broken link. Remove
      # dangling symlinks only — they carry no content; valid skill symlinks
      # still resolve and are copied normally.
      - name: Prune dangling symlinks in agent deps
        shell: bash
        run: find testeiya/node_modules -type l ! -exec test -e {} \; -exec rm -fv {} \;

      - name: Sync version from release tag
        if: github.event_name == 'release'
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build desktop installer
        run: bun run desktop:release

      # electrobun's self-extracting installers can't unpack this app's deep
      # node_modules (paths > 100 chars -> TarUnsupportedFileType). Repackage
      # into formats that can: AppImage (squashfs) on Linux, a plain zip on
      # Windows. macOS keeps the .dmg (no tar, unaffected).
      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: bash .github/packaging/build-linux-appimage.sh

      # electrobun's prebuilt macOS core ships libasar.dylib + zig-zstd with a
      # bogus minimum-OS of 14.8.x, so macOS < 14.8 refuses to launch the app.
      # Rewrite minos down to 11.0, ad-hoc re-sign, and rebuild the .dmg.
      - name: Fix macOS min-version and rebuild dmg
        if: runner.os == 'macOS'
        run: bash .github/packaging/fix-macos-minos.sh

      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path winstage | Out-Null
          tar.exe -xf artifacts/stable-win-x64-Testeiya.tar.zst -C winstage
          tar.exe -a -cf artifacts/stable-win-x64-Testeiya.zip -C winstage Testeiya
          Remove-Item artifacts/stable-win-x64-Testeiya-Setup.zip -Force -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force winstage
          Get-Item artifacts/stable-win-x64-Testeiya.zip | Format-List Name,Length

      - name: Attach installer to the Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.AppImage
            artifacts/*.dmg
            artifacts/stable-win-x64-Testeiya.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts (manual runs)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: testeiya-${{ matrix.label }}
          path: artifacts/*

  # After all installers are attached, append per-OS install instructions to the
  # Release body (once). Idempotent: skips if the marker is already present.
  release-notes:
    name: Add install instructions
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Append install instructions to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          body=$(gh release view "$TAG" --json body -q .body)
          if printf '%s' "$body" | grep -qF '<!-- install-instructions -->'; then
            echo "Install instructions already present — skipping."
            exit 0
          fi
          { printf '%s\n\n' "$body"; cat .github/release-install-notes.md; } \
            | gh release edit "$TAG" --notes-file -
