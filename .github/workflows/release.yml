name: Release

# Publishes the `testeiya` CLI to npm. The skills the agent reads are not kept
# in git, so every publish copies them fresh from testomatio/skills. Skip that
# step and the package ships an empty skills tree.
#
# CLI releases are made here by hand, on bare version tags (0.11.0), with
# hand-written notes. Desktop releases arrive from the app's own workflow,
# tagged app-<version> and titled "Testeiya App"; they never publish to npm.
# `workflow_dispatch` re-publishes a tag by hand, which is the recovery path
# when a release is edited rather than published (an edit fires no `published`).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. 0.10.2"
        required: true

permissions:
  contents: read
  # OIDC token for npm Trusted Publishing + provenance (no NPM_TOKEN needed).
  id-token: write

jobs:
  publish:
    name: Publish to npm
    if: "!startsWith(github.event.release.tag_name || inputs.tag, 'app-')"
    runs-on: ubuntu-latest
    # Write, to hand latest back to the desktop release below.
    permissions:
      contents: write
      id-token: write
    steps:
      # An empty ref keeps checkout's default, which on a release event is the
      # tag itself; a manual run names the tag it wants to republish.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Update npm (Trusted Publishing support)
        run: npm install -g npm@latest

      # The release event carries its own tag; a manual run passes it as an input.
      - name: Resolve the tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${RELEASE_TAG:-$INPUT_TAG}"
          test -n "$tag" || { echo "no release tag to publish"; exit 1; }
          echo "name=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag"

      - run: npm ci

      - name: Build
        run: npm run build

      # skills/ is gitignored. This fills it from testomatio/skills, and
      # `files: ["skills"]` then packs it.
      - name: Vendor the skills
        run: node scripts/vendor-skills.js

      - name: Sync version from the release tag
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: Determine npm dist-tag
        id: npm_tag
        env:
          TAG: ${{ steps.tag.outputs.name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if echo "$TAG" | grep -qE "alpha|-alpha|\.a\."; then
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
          elif echo "$TAG" | grep -qE "beta|-beta|\.b\."; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          elif echo "$TAG" | grep -qE "rc|-rc|\.rc\."; then
            echo "tag=rc" >> "$GITHUB_OUTPUT"
          elif [ "$PRERELEASE" = "true" ]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # Skip when the version is already on the registry (a re-run, or a first
      # version published by hand to bootstrap Trusted Publishing).
      - name: Publish
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "testeiya@$version" version >/dev/null 2>&1; then
            echo "testeiya@$version already published — skipping."
            exit 0
          fi
          npm publish --provenance --tag ${{ steps.npm_tag.outputs.tag }}

      # The desktop updater reads releases/latest/download/runtime.json, so a
      # CLI release left as latest would stop every installed app updating.
      - name: Keep the newest desktop release latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list -R "$GITHUB_REPOSITORY" --exclude-pre-releases --json tagName,name -q '[.[] | select(.name | startswith("Testeiya App"))][0].tagName')
          test -n "$tag" || { echo "no desktop release to mark latest"; exit 0; }
          gh release edit "$tag" -R "$GITHUB_REPOSITORY" --latest
