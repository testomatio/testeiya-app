name: pr-review
description: Review a pull request, propose test cases for it, and sync them to Testomat.io.

gates:
  code-changed:
    changes:
      min_files: 3
      ignore: ["**/*.md", "**/*.lock", "docs/**"]
    message: Fewer than 3 code files changed.
  testcases-needed:
    env: [CREATE_TESTCASES]
    message: 'No test cases created. Enable test case creation via CREATE_TESTCASES env var'
  testomatio:
    env: [TESTOMATIO]
    message: No Testomat.io project. Set TESTOMATIO.

when: [code-changed]

env:
  # feature/add-login → feature-add-login
  TESTOMATIO_BRANCH: ${GIT_BRANCH | slugify}


stages:
  - id: requirements
    title: Requirements
    emoji: 📋
    session: reviewer
    task: Work out what this pull request is meant to do. /qa-pr-requirements-analyzer

  - id: review
    title: Review
    emoji: 🔍
    session: reviewer
    task: Review this pull request as a QA engineer against requirements.md. /qa-review-pr
    inputs: [requirements.md]

  - id: test-cases
    title: Test cases
    emoji: 📝
    session: writer
    when: [testcases-needed]
    task: |
      If there is linked issue and it was already reviewed by Testeiya and have linked tests - skip this step
      Write test cases for this pull request from requirements.md and review.md. /qa-write-test-cases
      Put them in test-cases/, one markdown file per suite.
    inputs: [requirements.md, review.md]
    outputs: [test-cases/]

  - id: sync
    title: Sync to Testomat.io
    emoji: 🔄
    when: [testomatio, testcases-needed]
    task: |
      Sync the test cases in ${ITEM} to Testomat.io. /sync-test-cases-with-tms
