name: web-testing
description: Review a pull request, test the change in a browser with Explorbot, explain what broke.

gates:
  staging:
    env: [EXPLORBOT_URL]
    message: No staging URL. Set EXPLORBOT_URL to test in a browser.
  browser:
    run: ls "${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}" | grep -q chromium
    message: No browser. Run npx playwright install --with-deps chromium.
  explorbot-ai:
    env: [EXPLORBOT_AI_PROVIDER]
    message: Explorbot has no AI provider. Set EXPLORBOT_AI_PROVIDER and its key.

env:
  EXPLORBOT_NO_BANNER: "1"

stages:
  - id: review
    title: Review
    emoji: 🔍
    session: qa
    task: Review this pull request as a QA engineer. List the scenarios worth checking in a browser. /qa-review-pr

  - id: write-plan
    title: Test plan
    emoji: 🗺️
    session: qa
    when: [staging]
    task: Turn the browser scenarios in review.md into an Explorbot test plan for ${EXPLORBOT_URL} in plan.md. /explorbot-plan
    inputs: [review.md]
    outputs: [plan.md]

  - id: explore
    title: Browser testing
    emoji: 🌐
    when: [staging, browser, explorbot-ai]
    run: EXPLORBOT_OUTPUT="$STAGE_DIR/explorbot" npx -y explorbot test "$STAGE_DIR/plan.md" '*'
    inputs: [plan.md]
    outputs: [explorbot/]
    timeout: 30m

  - id: results
    title: Results
    emoji: 📊
    session: qa
    when: [staging, browser, explorbot-ai]
    task: |
      Read the Explorbot report in explorbot/ and say which failed scenarios are real defects and which are noise. /explorbot-fundamentals
      Fail the run if any is a real defect.
    inputs: [plan.md, explorbot/]
