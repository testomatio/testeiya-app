$dsl: ./pipeline.dsl.yml

name: web-testing
description: Review a pull request, test the change in a browser with Explorbot, explain what broke.
target: pr

$vars:
  EXPLORBOT_VERSION: { default: latest }

prerequisites:
  staging:
    $value!: vars.EXPLORBOT_URL != null
    message: No staging URL. Set EXPLORBOT_URL to test in a browser.
  browser:
    $value!sh: ls "${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}" | grep -q chromium
    message: No browser. Run npx playwright install --with-deps chromium.
  explorbot_ai:
    $value!: vars.EXPLORBOT_AI_PROVIDER != null
    message: Explorbot has no AI provider. Set EXPLORBOT_AI_PROVIDER and its key.
  # The pull request under test, which the agent finds with gh and git.
  git:
    $value!extract:
      what: The pull request under test. Use gh and git in this checkout.
      values:
        sha: sha of the commit under test
        pr: pull request number
        pr_url: pull request url
        branch: name of the branch

env:
  EXPLORBOT_NO_BANNER: "1"

packages:
  explorbot!: vars.EXPLORBOT_VERSION

stages:
  - id: review
    title: Review
    emoji: 🔍
    session: qa
    run!task: Review this pull request as a QA engineer. List the scenarios worth checking in a browser. /qa-review-pr

  - id: write-plan
    title: Test plan
    emoji: 🗺️
    session: qa
    when!: prerequisites.staging
    run!task: Turn the browser scenarios in review.md into an Explorbot test plan for {{ vars.EXPLORBOT_URL }} in plan.md. /explorbot-plan
    inputs: [review.md]
    outputs: [plan.md]

  - id: explore
    title: Browser testing
    emoji: 🌐
    when!: prerequisites.staging and prerequisites.browser and prerequisites.explorbot_ai
    run!sh: EXPLORBOT_OUTPUT="$STAGE_DIR/explorbot" npx explorbot test "$STAGE_DIR/plan.md" '*'
    inputs: [plan.md]
    outputs: [explorbot/]
    # Failed scenarios go to the results stage, which says which are real.
    continueOn: fail
    timeout: 30m

  - id: results
    title: Results
    emoji: 📊
    session: qa
    when!: prerequisites.staging and prerequisites.browser and prerequisites.explorbot_ai
    run!task: |
      Read the Explorbot report in explorbot/ and say which failed scenarios are real defects and which are noise. /explorbot-fundamentals
      Fail the run if any is a real defect.
    inputs: [plan.md, explorbot/]

$tests:
  - about: A staging URL turns the scenarios into a plan for it
    vars: { EXPLORBOT_URL: "https://staging.example.com" }
    expect: { prerequisites.staging: true, packages.explorbot: latest }
  - about: Without a staging URL there is no plan
    vars: { EXPLORBOT_VERSION: 0.6.0 }
    expect: { prerequisites.staging: false, packages.explorbot: 0.6.0 }
