name: api-testing
description: Find the API endpoints a pull request changed, test each with Explorbot, explain what broke.

gates:
  api:
    env: [API_BASE_URL, API_SPEC]
    message: No API to test. Set API_BASE_URL to the API base and API_SPEC to its OpenAPI spec.
  explorbot-ai:
    env: [EXPLORBOT_AI_PROVIDER]
    message: Explorbot has no AI provider. Set EXPLORBOT_AI_PROVIDER and its key.

env:
  EXPLORBOT_NO_BANNER: "1"

stages:
  - id: endpoints
    title: Analyze affected endpoints
    emoji: 🔍
    session: qa
    when: [API_SPEC]
    task: |
      List the API endpoints it adds or changes in endpoints.txt, one path per line like /users/{id}, empty if none.
    outputs: [endpoints.txt]

