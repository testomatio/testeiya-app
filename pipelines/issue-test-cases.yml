name: issue-test-cases
description: Turn an issue or epic into test cases, and sync them to Testomat.io.
target: issue

gates:
  issue:
    env: [ISSUE_URL]
    message: No issue. Set ISSUE_URL to the issue or epic to cover.
  testomatio:
    env: [TESTOMATIO, TESTOMATIO_PROJECT_ID]
    message: No Testomat.io project. Set TESTOMATIO and TESTOMATIO_PROJECT_ID.

when: [issue]

env:
  # https://github.com/org/repo/issues/42 → org-repo-issues-42
  TESTOMATIO_BRANCH: ${ISSUE_URL | path | slugify}

stages:
  - id: requirements
    title: Requirements
    emoji: 📋
    session: analyst
    task: Review the requirements in ${ISSUE_URL}. /qa-requirement-reviewer

  - id: test-cases
    title: Test cases
    emoji: 📝
    session: writer
    task: |
      Write test cases from requirements.md. /qa-write-test-cases
      Put them in test-cases/, one markdown file per suite.
    inputs: [requirements.md]
    outputs: [test-cases/]

  - id: sync
    title: Sync to Testomat.io
    emoji: 🔄
    when: [testomatio]
    each_file: test-cases/*.md
    task: |
      Sync the test cases in ${ITEM} to Testomat.io. /sync-test-cases-with-tms
      Skip a case that already exists there.
